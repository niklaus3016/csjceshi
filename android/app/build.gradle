apply plugin: 'com.android.application'

task deleteAdaptiveIconConfigs {
    doLast {
        def filesToDelete = [
            'src/main/res/drawable/ic_launcher_background.xml',
            'src/main/res/drawable-v24/ic_launcher_foreground.xml',
            'src/main/res/mipmap-anydpi-v26/ic_launcher.xml',
            'src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml'
        ]
        
        filesToDelete.each { filePath ->
            def fileObj = file(filePath)
            if (fileObj.exists()) {
                fileObj.delete()
                println "Deleted: $filePath"
            }
        }
    }
}

preBuild.dependsOn deleteAdaptiveIconConfigs

android { 
    namespace = "com.jianxuqingdan.app" 
    compileSdk = rootProject.ext.compileSdkVersion 
    defaultConfig { 
        applicationId "com.jianxuqingdan.app" 
        minSdkVersion rootProject.ext.minSdkVersion 
        targetSdkVersion rootProject.ext.targetSdkVersion 
        versionCode 1 
        versionName "V1.0" 
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner" 
        multiDexEnabled true
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        aaptOptions { 
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps. 
             // Default: `https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61` 
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~' 
        } 
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    } 
    
    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: '123456'
            keyAlias System.getenv('KEY_ALIAS') ?: 'yuexuxingzuo'
            keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD') ?: '123456'
            v1SigningEnabled true
            v2SigningEnabled true
            storeType 'JKS'
        }
    }
    
    buildTypes { 
        release { 
            minifyEnabled false 
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro' 
            if (file('release.keystore').exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            if (file('release.keystore').exists()) {
                signingConfig signingConfigs.release
            }
        }
    } 
}

repositories { 
    flatDir{ 
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs','./libs/adn','./libs/adapter' 
    } 
    maven { url 'https://artifact.bytedance.com/repository/AwemeOpenSDK' }
}

dependencies { 
    implementation fileTree(include: ['*.jar'], dir: 'libs') 
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion" 
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion" 
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion" 
    implementation project(':capacitor-android') 
    testImplementation "junit:junit:$junitVersion" 
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion" 
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion" 
    implementation project(':capacitor-cordova-android-plugins') 
    
    // 穿山甲 SDK
    implementation(name:'open_ad_sdk',ext:'aar')
    
    // 优量汇 SDK 和 Adapter
    implementation(name: "GDTSDK.unionNormal.4.680.1550", ext: 'aar')
    implementation(name: "mediation_gdt_adapter_4.680.1550.1", ext: 'aar')
    
    // 快手 SDK 和 Adapter
    implementation(name: "kssdk-ad-5.3.20.1", ext: 'aar')
    implementation(name: "mediation_ks_adapter_5.3.20.1.1", ext: 'aar')
    
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation 'com.google.android.gms:play-services-appset:16.0.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:3.12.1'
    implementation 'androidx.multidex:multidex:2.0.1'
}

apply from: 'capacitor.build.gradle'

try { 
    def servicesJSON = file('google-services.json') 
    if (servicesJSON.text) { 
        apply plugin: 'com.google.gms.google-services' 
    } 
} catch(Exception e) { 
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work") 
}